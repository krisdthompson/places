baseURL = "https://places.kttex.com/"
languageCode = "en-us"
title = "Places"
theme = "simple"

[params]
  description = "A collection of places"

[taxonomies]
  tag = "tags"
  type = "types"  # rentable, tovisit, beenthere, neato, buckit, avoid

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allows raw HTML in markdown content

# Ensure the places section correctly handles pages in subdirectories
[cascade]
  [cascade._target]
    path = "/places/**"
  type = "places"
